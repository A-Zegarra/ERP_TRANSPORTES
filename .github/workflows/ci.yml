name: Fase 0 - validación

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: larams-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Instalar versiones bloqueadas
        run: pnpm install --frozen-lockfile
      - name: Revisar tipos, lint y esquema
        run: pnpm check
      - name: Compilar frontend y backend
        run: pnpm build
      - name: Comprobar navegación y límites de la API
        run: pnpm test:smoke
      - name: Validar scripts de la HP
        run: |
          bash -n scripts/hp-diagnostico.sh
          bash -n scripts/hp-instalar.sh
          bash -n scripts/hp-cloudflare.sh
          shellcheck scripts/hp-diagnostico.sh scripts/hp-instalar.sh scripts/hp-cloudflare.sh
      - name: Probar conservación de configuración Cloudflare
        run: |
          python3 -m venv "$RUNNER_TEMP/larams-python"
          "$RUNNER_TEMP/larams-python/bin/pip" install PyYAML==6.0.2
          "$RUNNER_TEMP/larams-python/bin/python" -m unittest discover -s tests -p 'test_cloudflare.py'
      - name: Probar instalación y reversión con PM2 aislado
        run: |
          npm install --prefix "$RUNNER_TEMP/larams-pm2" pm2@6.0.8
          export PATH="$RUNNER_TEMP/larams-pm2/node_modules/.bin:$PATH"
          node --test tests/deploy.test.mjs
      - name: Ejecutar el instalador real dos veces en el runner
        env:
          LARAMS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          export PATH="$RUNNER_TEMP/larams-pm2/node_modules/.bin:$PATH"
          export PM2_HOME="$RUNNER_TEMP/larams-install-pm2"
          trap 'pm2 kill >/dev/null 2>&1 || true' EXIT
          bash scripts/hp-instalar.sh --local-only
          bash scripts/hp-instalar.sh --local-only
      - name: Empaquetar conservando enlaces y permisos
        run: |
          tar -czf larams-web.tgz -C apps/web/.next/standalone .
          sha256sum larams-web.tgz > larams-web.tgz.sha256
      - name: Guardar frontend compilado para evaluar despliegue en HP
        uses: actions/upload-artifact@v4
        with:
          name: larams-web-${{ github.sha }}
          path: |
            larams-web.tgz
            larams-web.tgz.sha256
          retention-days: 14
